<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00F59B" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#00E5FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#09090C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2028"/>
      <stop offset="100%" stop-color="#0C0D10"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B193"/>
      <stop offset="100%" stop-color="#9C6B53"/>
    </linearGradient>
    <filter id="studioGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00F59B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="500" height="500" rx="32" fill="#0D0E12"/>
  <circle cx="250" cy="220" r="180" fill="url(#bgGlow)"/>

  <!-- Audio Waveform Circle in BG -->
  <circle cx="250" cy="220" r="190" stroke="url(#neonRim)" stroke-width="1.5" stroke-dasharray="6 8" stroke-opacity="0.4"/>
  <circle cx="250" cy="220" r="160" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Subtle Studio Lights -->
  <circle cx="90" cy="110" r="4" fill="#00F59B" opacity="0.8"/>
  <circle cx="410" cy="120" r="5" fill="#00E5FF" opacity="0.8"/>
  <path d="M70 250 L430 250" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1"/>

  <!-- Shoulders / Jacket -->
  <path d="M120 450 C 130 360, 180 320, 250 320 C 320 320, 370 360, 380 450 Z" fill="url(#jacketGrad)" stroke="#2A2D38" stroke-width="2"/>
  <!-- Hood / Collar -->
  <path d="M185 340 L 250 420 L 315 340 C 290 325, 210 325, 185 340 Z" fill="#14151B" stroke="#00F59B" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Neck -->
  <path d="M225 280 L 225 330 C 235 340, 265 340, 275 330 L 275 280 Z" fill="url(#skinGrad)"/>

  <!-- Head / Face -->
  <path d="M190 200 C 190 130, 310 130, 310 200 C 310 260, 275 295, 250 295 C 225 295, 190 260, 190 200 Z" fill="url(#skinGrad)"/>

  <!-- Hair / Styling -->
  <path d="M185 185 C 180 130, 240 100, 310 115 C 320 140, 320 170, 315 190 C 300 150, 240 135, 195 160 Z" fill="#0F1015"/>
  <path d="M210 110 C 250 95, 290 105, 315 130 C 280 120, 240 120, 210 110 Z" fill="#1A1C24"/>

  <!-- Designer Studio Headphones -->
  <!-- Headband -->
  <path d="M165 190 C 160 100, 340 100, 335 190" stroke="#1E2028" stroke-width="18" stroke-linecap="round"/>
  <path d="M165 190 C 160 100, 340 100, 335 190" stroke="url(#neonRim)" stroke-width="3" stroke-linecap="round" opacity="0.9" filter="url(#studioGlow)"/>

  <!-- Earcups -->
  <rect x="155" y="180" width="26" height="55" rx="12" fill="#14151B" stroke="#00F59B" stroke-width="2"/>
  <rect x="319" y="180" width="26" height="55" rx="12" fill="#14151B" stroke="#00E5FF" stroke-width="2"/>
  <circle cx="168" cy="207" r="6" fill="#00F59B" opacity="0.8"/>
  <circle cx="332" cy="207" r="6" fill="#00E5FF" opacity="0.8"/>

  <!-- Facial Features / Sleek Stylized Eyes & Beard -->
  <path d="M215 195 Q 230 190 240 195" stroke="#4A3B32" stroke-width="3" stroke-linecap="round"/>
  <path d="M260 195 Q 270 190 285 195" stroke="#4A3B32" stroke-width="3" stroke-linecap="round"/>
  <path d="M220 205 Q 230 200 238 205" stroke="#1A1C24" stroke-width="2.5"/>
  <path d="M262 205 Q 270 200 280 205" stroke="#1A1C24" stroke-width="2.5"/>
  <path d="M248 210 L 246 235 L 254 235" stroke="#875841" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Beard & Jawline -->
  <path d="M205 230 C 215 285, 285 285, 295 230 C 290 265, 210 265, 205 230 Z" fill="#14151C" opacity="0.7"/>

  <!-- UI Overlay elements -->
  <rect x="30" y="30" width="100" height="26" rx="6" fill="#12131A" stroke="#252733" stroke-width="1"/>
  <text x="42" y="47" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00F59B">REC ● 4K 60</text>

  <rect x="360" y="30" width="110" height="26" rx="6" fill="#12131A" stroke="#252733" stroke-width="1"/>
  <text x="372" y="47" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00E5FF">00:01:45:12</text>

  <!-- Bottom Floating Badge -->
  <g transform="translate(135, 420)">
    <rect width="230" height="42" rx="21" fill="#101217" stroke="url(#neonRim)" stroke-width="1.5" filter="url(#studioGlow)"/>
    <circle cx="24" cy="21" r="6" fill="#00F59B"/>
    <text x="42" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" letter-spacing="1">SUNNY THAKUR // PRO</text>
  </g>
</svg>
