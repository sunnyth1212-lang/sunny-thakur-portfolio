<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="flatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4E57"/>
      <stop offset="50%" stop-color="#5B606B"/>
      <stop offset="100%" stop-color="#3D4047"/>
    </linearGradient>
  </defs>
  <!-- Flat desaturated background -->
  <rect width="1200" height="675" fill="url(#flatGrad)"/>
  
  <!-- Flat city / subject silhouette (desaturated LOG) -->
  <path d="M0 500 L120 450 L200 480 L350 380 L480 430 L600 320 L750 400 L900 350 L1050 420 L1200 390 L1200 675 L0 675 Z" fill="#36393F"/>
  <rect x="250" y="240" width="140" height="300" fill="#42464D"/>
  <rect x="420" y="180" width="160" height="360" fill="#3D4148"/>
  <rect x="680" y="210" width="180" height="330" fill="#3F434A"/>
  <rect x="920" y="260" width="150" height="280" fill="#444850"/>

  <!-- Flat diffuse lighting with zero contrast -->
  <circle cx="600" cy="200" r="140" fill="#727782" opacity="0.3"/>

  <!-- RAW LOG OVERLAY UI -->
  <rect x="40" y="40" width="220" height="48" rx="8" fill="#1E2024" fill-opacity="0.85" stroke="#3A3E47"/>
  <text x="60" y="70" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#E2E4E8">● SONY S-LOG3 RAW</text>

  <rect x="40" y="580" width="340" height="55" rx="8" fill="#1E2024" fill-opacity="0.85" stroke="#3A3E47"/>
  <text x="60" y="605" font-family="'Courier New', monospace" font-size="13" fill="#A4A8B3">ISO 800 • 3200K • UNGRADED</text>
  <text x="60" y="623" font-family="'Courier New', monospace" font-size="12" fill="#757984">Histogram: Flat Compressed Range</text>

  <!-- Crosshairs & framing grid -->
  <line x1="600" y1="40" x2="600" y2="635" stroke="#686D7A" stroke-width="1" stroke-dasharray="8 8" opacity="0.4"/>
  <line x1="40" y1="337" x2="1160" y2="337" stroke="#686D7A" stroke-width="1" stroke-dasharray="8 8" opacity="0.4"/>
  <rect x="150" y="80" width="900" height="515" stroke="#686D7A" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
</svg>
